[package]
name = "ruinas-esquecidas"
version = "0.1.0"
description = "Roguelite 2D de ação lateral com tema de fantasia sombria."
authors = ["Joao Pedro"]
license = "MIT"
repository = "https://github.com/joaobrocua/roguelike_2d"
edition = "2024"
rust-version = "1.90"

[lib]
name = "ruinas_esquecidas_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }

[profile.release]
# Executável menor: o jogo roda no navegador embutido, o Rust só abre a janela
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
